name: Simple CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

  notify:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Success message
        run: echo "✅ Build and tests passed on branch ${{ github.ref_name }}"
